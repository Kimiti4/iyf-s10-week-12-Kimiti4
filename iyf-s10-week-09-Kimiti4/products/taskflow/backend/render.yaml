services:
  - type: web
    name: taskflow-backend
    runtime: node
    plan: starter
    rootDir: products/taskflow/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/tf/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
        description: "Supabase PostgreSQL connection string from Dashboard → Connect → Connection string → URI. Format: postgresql://postgres:<password>@db.<project-ref>.supabase.co:5432/postgres"
      - key: JWT_SECRET
        sync: false
        description: "Random 32+ character string for JWT signing. Generate locally with: openssl rand -base64 32"
      - key: CORS_ORIGIN
        sync: false
        description: "Frontend URL for CORS. Set to your Vercel deployment URL, e.g., https://taskflow-frontend.vercel.app"
      - key: SUPABASE_URL
        sync: false
        description: "Supabase Project URL from Dashboard → Settings → API Keys (or Connect). Format: https://<project-ref>.supabase.co"
      - key: SUPABASE_KEY
        sync: false
        description: "Supabase Secret key (sb_secret_...) for backend/server use. Found in Dashboard → Settings → API Keys. Server-side only — never expose to browser. This key bypasses RLS for API operations on behalf of users."
    domains: []
