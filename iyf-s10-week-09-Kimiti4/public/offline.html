<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JamiiLink - Offline</title>
  <style>
    body {
      font-family: 'Inter var', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 20px;
    }
    .emoji { font-size: 4rem; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; margin-bottom: 10px; }
    p { opacity: 0.9; max-width: 400px; }
    .retry-btn {
      margin-top: 20px;
      padding: 12px 24px;
      background: white;
      color: #667eea;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="emoji">📡</div>
  <h1>You're Offline!</h1>
  <p>JamiiLink works offline. Your posts will be saved and sent when you reconnect. 🌍</p>
  <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
</body>
</html>
