name: CI/CD Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iyf-s10-week-09-Kimiti4/package-lock.json
      - run: npm ci
        working-directory: iyf-s10-week-09-Kimiti4
      - run: npm run build
        working-directory: iyf-s10-week-09-Kimiti4
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: iyf-s10-week-09-Kimiti4/dist/
          retention-days: 3

  e2e:
    needs: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iyf-s10-week-09-Kimiti4/package-lock.json
      - run: npm ci
        working-directory: iyf-s10-week-09-Kimiti4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: iyf-s10-week-09-Kimiti4
      # These browser suites intentionally intercept API calls. They certify
      # frontend/UI behavior and are not a substitute for backend integration.
      - run: npm run build
        working-directory: iyf-s10-week-09-Kimiti4
      - run: npx playwright test e2e/ --reporter=html
        working-directory: iyf-s10-week-09-Kimiti4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: iyf-s10-week-09-Kimiti4/playwright-report/
          retention-days: 7

  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jamii_link_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d jamii_link_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jamii_link_test
      JWT_SECRET: ci-only-jwt-secret-change-me
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://127.0.0.1:4173
      DEMO_TOKEN: ci-only-demo-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iyf-s10-week-11-Kimiti4/package-lock.json
      - run: npm ci
        working-directory: iyf-s10-week-11-Kimiti4
      - run: npm run db:migrate:all
        working-directory: iyf-s10-week-11-Kimiti4
      - run: npm run test:ci
        working-directory: iyf-s10-week-11-Kimiti4
      - name: Start backend
        working-directory: iyf-s10-week-11-Kimiti4
        run: |
          nohup npm start > /tmp/jamiilink-backend.log 2>&1 &
          echo $! > /tmp/jamiilink-backend.pid
      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3333/api/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed health check"
          cat /tmp/jamiilink-backend.log
          exit 1
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/jamiilink-backend.pid ]; then kill "$(cat /tmp/jamiilink-backend.pid)" || true; fi

  lighthouse-ci:
    needs: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iyf-s10-week-09-Kimiti4/package-lock.json
      - run: npm ci
        working-directory: iyf-s10-week-09-Kimiti4
      - run: npm run build
        working-directory: iyf-s10-week-09-Kimiti4
        env:
          VITE_API_URL: http://localhost:4173/api
      - run: npx lhci autorun
        working-directory: iyf-s10-week-09-Kimiti4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: iyf-s10-week-09-Kimiti4/.lighthouseci/
          retention-days: 7

  deploy-preview:
    needs: [e2e, backend-integration, lighthouse-ci]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "All frontend and backend checks passed. Ready for Vercel preview deploy."

  deploy-production:
    needs: [e2e, backend-integration, lighthouse-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iyf-s10-week-09-Kimiti4/package-lock.json
      - run: npm ci
        working-directory: iyf-s10-week-09-Kimiti4
      - run: npm run build
        working-directory: iyf-s10-week-09-Kimiti4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: iyf-s10-week-09-Kimiti4
          vercel-args: '--prod'
          vercel-project-name: 'jamii-link'
