name: CI/CD Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iyf-s10-week-09-Kimiti4/package-lock.json
      - run: npm ci
        working-directory: iyf-s10-week-09-Kimiti4
      - run: npm run build
        working-directory: iyf-s10-week-09-Kimiti4
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: iyf-s10-week-09-Kimiti4/dist/
          retention-days: 3

  e2e:
    needs: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iyf-s10-week-09-Kimiti4/package-lock.json
      - run: npm ci
        working-directory: iyf-s10-week-09-Kimiti4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: iyf-s10-week-09-Kimiti4
      # Build the static bundle first: the e2e suite serves dist via `vite
      # preview` (deterministic, no cold dev-server compile) and mocks every
      # API call, so it passes with any backend or none.
      - run: npm run build
        working-directory: iyf-s10-week-09-Kimiti4
      - run: npx playwright test e2e/ --reporter=html
        working-directory: iyf-s10-week-09-Kimiti4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: iyf-s10-week-09-Kimiti4/playwright-report/
          retention-days: 7

  lighthouse-ci:
    needs: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iyf-s10-week-09-Kimiti4/package-lock.json
      - run: npm ci
        working-directory: iyf-s10-week-09-Kimiti4
      # Point the bundle's API base at the LHCI stub server (overrides .env,
      # which bakes in the Railway URL and causes CORS console errors).
      - run: npm run build
        working-directory: iyf-s10-week-09-Kimiti4
        env:
          VITE_API_URL: http://localhost:4173/api
      - run: npx lhci autorun
        working-directory: iyf-s10-week-09-Kimiti4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: iyf-s10-week-09-Kimiti4/.lighthouseci/
          retention-days: 7

  deploy-preview:
    needs: [e2e, lighthouse-ci]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "✅ All checks passed. Ready for Vercel preview deploy."

  deploy-production:
    needs: [e2e, lighthouse-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iyf-s10-week-09-Kimiti4/package-lock.json
      - run: npm ci
        working-directory: iyf-s10-week-09-Kimiti4
      - run: npm run build
        working-directory: iyf-s10-week-09-Kimiti4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: iyf-s10-week-09-Kimiti4
          vercel-args: '--prod'
          vercel-project-name: 'jamii-link'