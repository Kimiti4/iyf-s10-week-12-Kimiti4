name: CI/CD Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iyf-s10-week-09-Kimiti4/package-lock.json
      - run: npm ci
        working-directory: iyf-s10-week-09-Kimiti4
      - run: npm run build
        working-directory: iyf-s10-week-09-Kimiti4
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: iyf-s10-week-09-Kimiti4/dist/
          retention-days: 3

  e2e:
    needs: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iyf-s10-week-09-Kimiti4/package-lock.json
      - run: npm ci
        working-directory: iyf-s10-week-09-Kimiti4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: iyf-s10-week-09-Kimiti4
      # Build the static bundle first: the e2e suite serves dist via `vite
      # preview` (deterministic, no cold dev-server compile) and mocks every
      # API call, so it passes with any backend or none.
      - run: npm run build
        working-directory: iyf-s10-week-09-Kimiti4
        env:
          # E2E serves the production Vite bundle, so provide an explicit
          # same-origin API base for Playwright's /api route mocks.
          VITE_API_URL: /api
      - run: npx playwright test e2e/ --reporter=html
        working-directory: iyf-s10-week-09-Kimiti4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: iyf-s10-week-09-Kimiti4/playwright-report/
          retention-days: 7

  lighthouse-ci:
    needs: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iyf-s10-week-09-Kimiti4/package-lock.json
      - run: npm ci
        working-directory: iyf-s10-week-09-Kimiti4
      # Point the bundle's API base at the LHCI stub server (overrides .env,
      # which bakes in the Railway URL and causes CORS console errors).
      - run: npm run build
        working-directory: iyf-s10-week-09-Kimiti4
        env:
          VITE_API_URL: http://localhost:4173/api
      - run: npx lhci autorun
        working-directory: iyf-s10-week-09-Kimiti4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: iyf-s10-week-09-Kimiti4/.lighthouseci/
          retention-days: 7

  deploy-preview:
    needs: [e2e, lighthouse-ci]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "✅ All checks passed. Ready for Vercel preview deploy."

  deploy-production:
    # Vercel's Git integration deploys main to production (the VERCEL_* secrets
    # are not configured), so instead of a redundant CLI deploy this job verifies
    # the live site after tests pass: SPA up, entry bundle served, production API
    # base baked into the bundle (catches a missing VITE_API_URL), and the
    # Render backend healthy.
    needs: [e2e, lighthouse-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production deployment
        env:
          PROD_URL: https://jamii-link.vercel.app
          API_ORIGIN: https://jami-link.onrender.com
        run: |
          set -uo pipefail
          echo "Checking $PROD_URL (Vercel deploys main automatically)..."
          ready=0
          for attempt in $(seq 1 12); do
            echo "--- SPA attempt $attempt/12 ---"
            html=$(curl -fsS --max-time 20 "$PROD_URL/" 2>/dev/null || true)
            asset=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' <<<"$html" | head -n1 || true)
            bundle=""
            if [ -n "$asset" ]; then
              bundle=$(curl -fsS --max-time 30 "$PROD_URL$asset" 2>/dev/null || true)
            fi
            if grep -q 'id="root"' <<<"$html" && grep -q 'jami-link.onrender.com' <<<"$bundle"; then
              echo "OK: SPA serving and live API base baked into $asset"
              ready=1
              break
            fi
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL: production site did not serve a configured bundle in time"
            exit 1
          fi
          echo "Checking backend health at $API_ORIGIN/api/health..."
          for attempt in 1 2 3 4; do
            health=$(curl -fsS --max-time 60 "$API_ORIGIN/api/health" 2>/dev/null || true)
            if grep -q '"db":true' <<<"$health"; then
              echo "OK: backend healthy $health"
              exit 0
            fi
            echo "backend not ready (attempt $attempt/4): ${health:-no response}"
            sleep 10
          done
          echo "FAIL: backend health check"
          exit 1